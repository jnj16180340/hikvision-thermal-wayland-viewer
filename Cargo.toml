[package]
name = "hikvision-thermal-wayland-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-rtsp-server = "0.23"
libloading = "0.8"
softbuffer = "0.4"
winit = { version = "0.30", default-features = false, features = ["wayland", "rwh_06"] }
